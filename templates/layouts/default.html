<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Elytron: {page.title}</title>
    <script src="{site.url('/assets/javascript/highlight.pack.js')}" type="text/javascript"></script>

    <link rel="shortcut icon" type="image/png" href="{site.url('favicon.ico')}">
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Roboto:300,400,500,700" type="text/css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!-- We override the colours from this theme manually -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
    <link rel="stylesheet" href="{site.url('/assets/css/styles.css')}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css" integrity="sha384-lKuwvrZot6UHsBSfcMvOkWwlCMgc0TaWr+30HWe3a4ltaBwTZhyTEggF5tJv8tbt" crossorigin="anonymous">
    <script src="{site.url('/assets/javascript/hl.js')}" type="text/javascript"></script>
    <link rel="alternate" type="application/rss+xml" href="{site.url('feed.xml')}" title="WildFly Elytron">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-135301155-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag()\{dataLayer.push(arguments);\}
        gtag('js', new Date());
        gtag('config', 'UA-135301155-1');
    </script>
    {#seo page site /}
    <link rel="stylesheet" href="{site.url('styles.css')}">
    {#bundle /}
    <style>
        &.guide-icon_linux {
            background-image: url({site.url}assets/images/guides/icon-linux.png);
        }

        &.guide-icon_windows {
            background-image: url({site.url}assets/images/guides/icon-windows.png);
        }

        &.guide-icon_macos {
            background-image: url({site.url}assets/images/guides/icon-macos.png);
        }
    </style>
</head>
<body>


<!-- Always shows a header, even in smaller screens. -->
<div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <header class="mdl-layout__header mdl-layout__header--scroll">
        <div class="mdl-layout__header-row ">
            <!-- Title -->
            <span class="mdl-layout-title"><h3 onclick="window.location.href='{site.url}'">Wild<strong>Fly</strong> Elytron</h3></span>
            <!-- Add spacer to align navigation to the right -->
            <div class="mdl-layout-spacer"></div>
            <nav class="mdl-navigation mdl-layout--large-screen-only">
                {#include partials/navigation.html /}
            </nav>
        </div>
    </header>
    <div class="mdl-layout__drawer">
        <div class="side-drawer-logo-container"><h3>Wild<strong>Fly</strong> Elytron</h3></div>
        <nav class="mdl-navigation">
            {#include partials/navigation.html /}
        </nav>
    </div>
    <main class="mdl-layout__content">
        <div class="page-content">
            {#if page.url == site.url}
                <div class="large-logo">
                    <h1>Wild<strong>Fly</strong> Elytron</h1>
                </div>
            {/if}
            <div class="content">
                {#insert /}
            </div>
        </div>
    </main>
</div>
</body>
</html>
