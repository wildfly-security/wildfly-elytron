server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location "/realms/WildFly" {
        proxy_pass $KC_ENDPOINT;
        proxy_set_header X-Forwarded-Host localhost:$PROXY_PORT;
        proxy_set_header Host localhost:$PROXY_PORT;
    }

    location "/keycloak/realms/WildFly" {
            proxy_pass $KC_ENDPOINT;
            proxy_set_header X-Forwarded-Host localhost:$PROXY_PORT;
            proxy_set_header Host localhost:$PROXY_PORT;
    }

    location "/clientApp" {
        proxy_pass "http://host.testcontainers.internal:$CLIENT_PORT/clientApp";
        proxy_set_header X-Forwarded-Host localhost:$PROXY_PORT;
        proxy_set_header Host localhost:$PROXY_PORT;
    }

    location "/clientApp/service/secured" {
        proxy_pass "http://host.testcontainers.internal:$CLIENT_PORT/clientApp/service/secured";
        proxy_set_header X-Forwarded-Host localhost:$PROXY_PORT;
        proxy_set_header Host localhost:$PROXY_PORT;
    }
}
